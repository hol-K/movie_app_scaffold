name: Flutter CI

on:
  push:
    branches: [master, other]
  pull_request:
    branches: [master, other]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Unit and widget tests
        run: flutter test --coverage

  integration:
    name: Integration tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.2"
          cache: true

      - name: Install ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-chromedriver xvfb

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' bash -c '
            chromedriver --port=4444 &
            driver_pid=$!
            trap "kill $driver_pid" EXIT
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_flow_test.dart -d chrome
          '

  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movie-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Build iOS archive
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned IPA
        run: flutter build ipa --no-codesign

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: movie-app-ios-unsigned
          path: build/ios/ipa/*.ipa
